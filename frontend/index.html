<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- L-4: Restrict Referer header to origin-only on cross-origin navigation so
         sensitive tokens in query parameters are not leaked to third-party servers. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Olympus</title>

    <!-- PWA Meta Tags -->
    <meta name="description" content="Olympus print farm — printers, filament, and print management" />
    <meta name="theme-color" content="#00ae42" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Olympus" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/img/olympus-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/img/olympus-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/img/olympus-180.png" />

    <!-- Splash screens for iOS -->
    <link rel="apple-touch-startup-image" href="/img/olympus-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration (skip on SpoolBuddy kiosk).
         Kept as an external file so the CSP `script-src 'self'` covers it
         without needing 'unsafe-inline' or per-build hashes. -->
    <script src="/sw-register.js"></script>
  </body>
</html>
